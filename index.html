<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice Game Editor - ELT Workshop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Poppins', sans-serif; background-color: #1a1a2e; color: #e0e0e0;
            display: flex; padding: 20px; gap: 30px; height: 100vh; margin: 0; box-sizing: border-box;
        }
        .editor-panel, .preview-panel {
            background-color: #16213e; padding: 25px; border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .editor-panel { width: 50%; display: flex; flex-direction: column; overflow-y: auto; }
        .editor-panel::-webkit-scrollbar { width: 6px; }
        .editor-panel::-webkit-scrollbar-thumb { background: #535c91; border-radius: 3px; }
        .preview-panel { width: 50%; display: flex; flex-direction: column; position: relative; padding-bottom: 40px;}
        h1, h2 { color: #ff9a9e; text-shadow: 0 0 8px rgba(255, 154, 158, 0.6); margin-top: 0; text-align: center; }
        h3 { color: #a1c4fd; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #535c91; padding-bottom: 5px; margin-top: 25px;}
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #b3b3b3;}
        .label-with-btn { display: flex; justify-content: space-between; align-items: center; }
        input[type="url"], input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #535c91;
            background-color: #0f3460; color: #fff; box-sizing: border-box; font-family: 'Poppins', sans-serif;
            font-size: 13px; transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: #a1c4fd; outline: none; }
        input[type="range"] { width: 100%; accent-color: #ff9a9e; cursor: pointer; }
        textarea { resize: vertical; min-height: 100px; white-space: pre; overflow-wrap: normal; overflow-x: auto;}
        input[type="color"] { padding: 0; border: none; width: 40px; height: 30px; border-radius: 5px; cursor: pointer;}
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #ff9a9e; cursor: pointer; }
        
        .flex-row { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .color-group { display: flex; align-items: center; background: #0f3460; padding: 5px 12px; border-radius: 8px; border: 1px solid #535c91; gap: 10px; flex: 1; justify-content: center;}
        .val-display { font-weight: 700; color: #a1c4fd; }

        .round-box { background: rgba(0,0,0,0.25); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px dashed #535c91;}
        .btn-outline { background: transparent; border: 2px dashed #ff9a9e; color: #ff9a9e; width: 100%; margin-top: 5px;}
        .btn-outline:hover { background: rgba(255, 154, 158, 0.1); }
        .upload-btn {
            padding: 4px 10px; font-size: 11px; font-weight: 500;
            background: #0f3460; border: 1px solid #535c91; color: #a1c4fd;
            border-radius: 5px; cursor: pointer;
        }
        .upload-btn:hover { background: #535c91; }

        #previewFrame { width: 100%; flex: 1; border: 1px solid #535c91; border-radius: 10px; background-color: transparent; }
        button {
            background: linear-gradient(90deg, #ff9a9e, #fecfef); color: #1a1a2e;
            padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 700; transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4); }
        
        #generated-code { height: 100px; margin-top: 10px; color: #a7d129; font-family: monospace; font-size: 11px;}
        .copyright { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>

    <div class="editor-panel">
        <h1>Alice Game Editor</h1>
        
        <h3>Основные настройки</h3>
        <div class="form-group">
            <label>Название игры</label>
            <input type="text" id="gameTitle" value="Alice in Wonderland">
        </div>
        <div class="flex-row">
            <div class="form-group" style="flex:1;">
                <label>Язык интерфейса</label>
                <select id="uiLang" onchange="updateLangTexts()">
                    <option value="EN">English</option><option value="RU">Русский</option><option value="ES">Español</option><option value="FR">Français</option><option value="DE">Deutsch</option><option value="IT">Italiano</option><option value="PT">Português</option><option value="PL">Polski</option><option value="TR">Türkçe</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;">
                <label>Текст кнопки СТАРТ</label>
                <input type="text" id="startBtnText" value="START">
            </div>
        </div>

        <div class="flex-row">
            <div class="form-group" style="flex:1;">
                <label>Скорость полета (сек)</label>
                <input type="number" id="flySpeed" value="6" min="1" max="20" step="0.5">
            </div>
            <div class="form-group" style="flex:1;">
                <label>Таймер (сек на вопрос)</label>
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="useTimer" checked>
                    <input type="number" id="timeSec" value="15" min="3" max="120" style="width:100%;">
                </div>
            </div>
        </div>

        <h3>Размеры и Цвета</h3>
        <div class="form-group">
            <label>Размер героя (Алисы): <span class="val-display" id="aliceSizeLbl">350</span>px</label>
            <input type="range" id="aliceSize" min="100" max="600" value="350">
        </div>
        <div class="form-group">
            <label>Размер артефактов: <span class="val-display" id="artifactSizeLbl">100</span>px</label>
            <input type="range" id="artifactSize" min="50" max="200" value="100">
        </div>
        <div class="flex-row">
            <div class="color-group"><label>Цвет кнопки СТАРТ</label><input type="color" id="startBtnColor" value="#ff9a9e"></div>
             <div class="color-group">
                <input type="checkbox" id="useGlow" checked> <label>Неон</label>
                <input type="color" id="glowColor" value="#ff9a9e">
            </div>
        </div>

        <h3>Изображения</h3>
        <div class="form-group">
            <div class="label-with-btn"><label>Фон игры</label><button class="upload-btn" onclick="document.getElementById('file-bg').click()">Загрузить</button></div>
            <input type="text" id="bgUrl" value="https://i.postimg.cc/pdDZpkwN/e0ec6d9f9615e7750f927524ed25e6f8_6dfc6818_3c9b_49c3_9e24_1134d4c80b7c.jpg">
        </div>
        <div class="flex-row">
             <div class="form-group" style="flex:1;">
                <div class="label-with-btn"><label>Персонаж (Алиса)</label><button class="upload-btn" onclick="document.getElementById('file-alice').click()">Загрузить</button></div>
                <input type="text" id="aliceUrl" value="https://i.postimg.cc/DZncsLTj/Alice.png">
            </div>
             <div class="form-group" style="flex:1;">
                <div class="label-with-btn"><label>Иконка таймера (Кролик)</label><button class="upload-btn" onclick="document.getElementById('file-rabbit').click()">Загрузить</button></div>
                <input type="text" id="rabbitUrl" value="https://i.postimg.cc/d1w9drY5/rabbit.png">
            </div>
        </div>
         <div class="form-group">
            <div class="label-with-btn"><label>Изображение на экране победы</label><button class="upload-btn" onclick="document.getElementById('file-alice-win').click()">Загрузить</button></div>
            <input type="text" id="aliceWinUrl" value="https://i.postimg.cc/LX2VfLpy/Alice-2.png">
        </div>

        <div class="form-group">
            <label>Артефакты (можно URL или загрузить свои)</label>
            <textarea id="artifactsUrls" style="min-height: 60px;">https://i.postimg.cc/V68KR2jZ/10.png
https://i.postimg.cc/ydHLP2Fr/11.png
https://i.postimg.cc/nzJ3kNvP/12.png
https://i.postimg.cc/rmkfJ7Sb/5.png
https://i.postimg.cc/SshgrH6b/6.png
https://i.postimg.cc/cHSFmPRZ/7.png
https://i.postimg.cc/pTHsZ3fR/8.png
https://i.postimg.cc/DZTxgRrK/9.png</textarea>
            <button class="btn-outline" onclick="document.getElementById('file-artifacts').click()" style="padding: 5px; font-size:12px;">+ Загрузить артефакты (можно выбрать несколько)</button>
        </div>

        <h3>Оформление текстов</h3>
        <div class="flex-row">
            <div class="form-group" style="flex:1;">
                <label>Шрифт Вопроса</label>
                <select id="qFontFamily">
                    <option value="'Alice', serif">Alice</option>
                    <option value="'Poppins', sans-serif">Poppins</option>
                    <option value="'Montserrat', sans-serif">Montserrat</option>
                    <option value="'Russo One', sans-serif">Russo One</option>
                    <option value="'Caveat', cursive">Caveat</option>
                    <option value="'Kurale', serif">Kurale</option>
                    <option value="'Comfortaa', sans-serif">Comfortaa</option>
                    <option value="'Amatic SC', cursive">Amatic SC</option>
                    <option value="'Oswald', sans-serif">Oswald</option>
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="'Neucha', cursive">Neucha</option>
                    <option value="'Bad Script', cursive">Bad Script</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;">
                <label>Шрифт Ответов</label>
                <select id="aFontFamily">
                    <option value="'Alice', serif">Alice</option>
                    <option value="'Poppins', sans-serif" selected>Poppins</option>
                    <option value="'Montserrat', sans-serif">Montserrat</option>
                    <option value="'Russo One', sans-serif">Russo One</option>
                    <option value="'Caveat', cursive">Caveat</option>
                    <option value="'Kurale', serif">Kurale</option>
                    <option value="'Comfortaa', sans-serif">Comfortaa</option>
                    <option value="'Amatic SC', cursive">Amatic SC</option>
                    <option value="'Oswald', sans-serif">Oswald</option>
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="'Neucha', cursive">Neucha</option>
                    <option value="'Bad Script', cursive">Bad Script</option>
                </select>
            </div>
        </div>
        <div class="flex-row">
            <div class="color-group"><label>Цвет текста Вопроса</label><input type="color" id="qColor" value="#ffffff"></div>
            <div class="color-group"><label>Фон Вопроса</label><input type="color" id="qBgColor" value="#000000"></div>
        </div>
        <div class="flex-row">
            <div class="color-group"><label>Цвет текста Ответов</label><input type="color" id="aColor" value="#ffffff"></div>
            <div class="color-group"><label>Фон Ответов</label><input type="color" id="aBgColor" value="#000000"></div>
        </div>
        <div class="form-group">
            <label>Размер шрифта ВОПРОСА: <span class="val-display" id="qSizeLbl">28</span>px</label>
            <input type="range" id="qFontSize" min="16" max="60" value="28">
        </div>
        <div class="form-group">
            <label>Размер шрифта ОТВЕТОВ: <span class="val-display" id="aSizeLbl">18</span>px</label>
            <input type="range" id="aFontSize" min="12" max="40" value="18">
        </div>

        <h3>Раунды и Вопросы</h3>
        <div class="flex-row" style="margin-bottom: 5px;">
            <input type="checkbox" id="mixAnswers" checked>
            <label style="margin:0; font-size:12px;">Авто-обманки (брать чужие правильные ответы)</label>
        </div>
        <div id="roundsContainer"></div>
        <button class="btn-outline" onclick="addRound()">+ Добавить раунд (Макс 5)</button>

        <h3>Финал игры</h3>
        <div class="flex-row">
            <div class="form-group" style="flex:1;"><label>Текст при победе</label><input type="text" id="winText" value="You are just in time!"></div>
            <div class="form-group" style="flex:1;"><label>Текст при проигрыше</label><input type="text" id="loseText" value="GAME OVER"></div>
        </div>
        <div class="flex-row">
            <div class="form-group" style="flex:1;"><label>Текст кнопки Try Again</label><input type="text" id="tryAgainText" value="Try Again"></div>
            <div class="form-group" style="flex:1;"><label>Текст кнопки Play Again</label><input type="text" id="playAgainText" value="Play Again"></div>
        </div>
        
        <div class="flex-row" style="margin-top:15px; gap:10px;">
            <button onclick="saveProject()" style="flex:1; background: linear-gradient(90deg, #a1c4fd, #c2e9fb); color: #1a1a2e;">Сохранить проект</button>
            <button onclick="document.getElementById('file-project').click()" style="flex:1; background: linear-gradient(90deg, #84fab0, #8fd3f4); color: #1a1a2e;">Загрузить проект</button>
        </div>
        <div class="flex-row" style="margin-top:10px; gap:10px;">
            <button id="copyBtn" onclick="copyCode()" style="flex:1;">Скопировать HTML</button>
            <button id="copyIframeBtn" onclick="copyIframeCode()" style="flex:1; background: linear-gradient(90deg, #fbc2eb, #a6c1ee); color: #1a1a2e;">Скопировать iframe (для Genially)</button>
        </div>
        <textarea id="generated-code" readonly placeholder="Здесь появится готовый код..."></textarea>
    </div>

    <div class="preview-panel">
        <h2>Предпросмотр</h2>
        <iframe id="previewFrame" src="" frameborder="0" allow="autoplay"></iframe>
        <p class="copyright">©2026 Alina Pogudina @ELT_workshop</p>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="file-bg" accept="image/*" style="display:none;">
    <input type="file" id="file-alice" accept="image/*" style="display:none;">
    <input type="file" id="file-rabbit" accept="image/*" style="display:none;">
    <input type="file" id="file-alice-win" accept="image/*" style="display:none;">
    <input type="file" id="file-artifacts" accept="image/*" multiple style="display:none;">
    <input type="file" id="file-project" accept=".json" style="display:none;">

    <script>
        const startDict = { EN: "START", RU: "ИГРАТЬ", ES: "JUGAR", FR: "JOUER", DE: "START", IT: "INIZIA", PT: "JOGAR", PL: "START", TR: "BAŞLA" };
        const tryDict = { EN: "Try Again", RU: "Повторить", ES: "Reintentar", FR: "Réessayer", DE: "Nochmal", IT: "Riprova", PT: "Tentar de novo", PL: "Spróbuj ponownie", TR: "Tekrar Dene" };
        const winDict = { EN: "Play Again", RU: "Играть снова", ES: "Jugar de nuevo", FR: "Rejouer", DE: "Nochmal spielen", IT: "Gioca ancora", PT: "Jogar de novo", PL: "Zagraj ponownie", TR: "Tekrar Oyna" };

        let roundCount = 0;

        function fileToBase64(file, callback) {
            const reader = new FileReader();
            reader.onload = () => callback(reader.result);
            reader.onerror = error => console.error('Error reading file:', error);
            reader.readAsDataURL(file);
        }

        function setupImageUpload(inputId, targetId) {
            document.getElementById(inputId).addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) fileToBase64(file, (base64) => { document.getElementById(targetId).value = base64; debounceGenerate(); });
            });
        }
        
        setupImageUpload('file-bg', 'bgUrl');
        setupImageUpload('file-alice', 'aliceUrl');
        setupImageUpload('file-rabbit', 'rabbitUrl');
        setupImageUpload('file-alice-win', 'aliceWinUrl');

        document.getElementById('file-artifacts').addEventListener('change', (event) => {
            const files = event.target.files, textarea = document.getElementById('artifactsUrls');
            let processed = 0;
            for (const file of files) {
                fileToBase64(file, (base64) => {
                    textarea.value = (textarea.value.trim() ? textarea.value.trim() + '\n' : '') + base64;
                    if(++processed === files.length) debounceGenerate();
                });
            }
        });

        document.getElementById('file-project').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.gameTitle !== undefined) document.getElementById('gameTitle').value = data.gameTitle;
                    if (data.uiLang !== undefined) document.getElementById('uiLang').value = data.uiLang;
                    if (data.startBtnText !== undefined) document.getElementById('startBtnText').value = data.startBtnText;
                    if (data.tryAgainText !== undefined) document.getElementById('tryAgainText').value = data.tryAgainText;
                    if (data.playAgainText !== undefined) document.getElementById('playAgainText').value = data.playAgainText;
                    if (data.flySpeed !== undefined) document.getElementById('flySpeed').value = data.flySpeed;
                    if (data.useTimer !== undefined) document.getElementById('useTimer').checked = data.useTimer;
                    if (data.timeSec !== undefined) document.getElementById('timeSec').value = data.timeSec;
                    if (data.aliceSize !== undefined) {
                        document.getElementById('aliceSize').value = data.aliceSize;
                        document.getElementById('aliceSizeLbl').innerText = data.aliceSize;
                    }
                    if (data.artifactSize !== undefined) {
                        document.getElementById('artifactSize').value = data.artifactSize;
                        document.getElementById('artifactSizeLbl').innerText = data.artifactSize;
                    }
                    if (data.startBtnColor !== undefined) document.getElementById('startBtnColor').value = data.startBtnColor;
                    if (data.useGlow !== undefined) document.getElementById('useGlow').checked = data.useGlow;
                    if (data.glowColor !== undefined) document.getElementById('glowColor').value = data.glowColor;
                    if (data.bgUrl !== undefined) document.getElementById('bgUrl').value = data.bgUrl;
                    if (data.aliceUrl !== undefined) document.getElementById('aliceUrl').value = data.aliceUrl;
                    if (data.rabbitUrl !== undefined) document.getElementById('rabbitUrl').value = data.rabbitUrl;
                    if (data.aliceWinUrl !== undefined) document.getElementById('aliceWinUrl').value = data.aliceWinUrl;
                    if (data.artifactsUrls !== undefined) document.getElementById('artifactsUrls').value = data.artifactsUrls;
                    if (data.qFontFamily !== undefined) document.getElementById('qFontFamily').value = data.qFontFamily;
                    if (data.aFontFamily !== undefined) document.getElementById('aFontFamily').value = data.aFontFamily;
                    if (data.qColor !== undefined) document.getElementById('qColor').value = data.qColor;
                    if (data.qBgColor !== undefined) document.getElementById('qBgColor').value = data.qBgColor;
                    if (data.aColor !== undefined) document.getElementById('aColor').value = data.aColor;
                    if (data.aBgColor !== undefined) document.getElementById('aBgColor').value = data.aBgColor;
                    if (data.qFontSize !== undefined) {
                        document.getElementById('qFontSize').value = data.qFontSize;
                        document.getElementById('qSizeLbl').innerText = data.qFontSize;
                    }
                    if (data.aFontSize !== undefined) {
                        document.getElementById('aFontSize').value = data.aFontSize;
                        document.getElementById('aSizeLbl').innerText = data.aFontSize;
                    }
                    if (data.mixAnswers !== undefined) document.getElementById('mixAnswers').checked = data.mixAnswers;
                    if (data.winText !== undefined) document.getElementById('winText').value = data.winText;
                    if (data.loseText !== undefined) document.getElementById('loseText').value = data.loseText;

                    if (Array.isArray(data.rounds)) {
                        document.getElementById('roundsContainer').innerHTML = '';
                        roundCount = 0;
                        data.rounds.forEach(r => {
                            addRound(r.name, r.qList, r.aList);
                        });
                    }
                    debounceGenerate();
                    event.target.value = '';
                } catch (err) {
                    alert('Ошибка при чтении файла проекта: ' + err.message);
                }
            };
            reader.readAsText(file);
        });

        function saveProject() {
            const rounds = [];
            document.querySelectorAll('.round-box').forEach(rb => {
                rounds.push({
                    name: rb.querySelector('.round-name').value || "",
                    qList: rb.querySelector('.q-list').value || "",
                    aList: rb.querySelector('.a-list').value || ""
                });
            });

            const projectData = {
                gameTitle: document.getElementById('gameTitle').value,
                uiLang: document.getElementById('uiLang').value,
                startBtnText: document.getElementById('startBtnText').value,
                tryAgainText: document.getElementById('tryAgainText').value,
                playAgainText: document.getElementById('playAgainText').value,
                flySpeed: document.getElementById('flySpeed').value,
                useTimer: document.getElementById('useTimer').checked,
                timeSec: document.getElementById('timeSec').value,
                aliceSize: document.getElementById('aliceSize').value,
                artifactSize: document.getElementById('artifactSize').value,
                startBtnColor: document.getElementById('startBtnColor').value,
                useGlow: document.getElementById('useGlow').checked,
                glowColor: document.getElementById('glowColor').value,
                bgUrl: document.getElementById('bgUrl').value,
                aliceUrl: document.getElementById('aliceUrl').value,
                rabbitUrl: document.getElementById('rabbitUrl').value,
                aliceWinUrl: document.getElementById('aliceWinUrl').value,
                artifactsUrls: document.getElementById('artifactsUrls').value,
                qFontFamily: document.getElementById('qFontFamily').value,
                aFontFamily: document.getElementById('aFontFamily').value,
                qColor: document.getElementById('qColor').value,
                qBgColor: document.getElementById('qBgColor').value,
                aColor: document.getElementById('aColor').value,
                aBgColor: document.getElementById('aBgColor').value,
                qFontSize: document.getElementById('qFontSize').value,
                aFontSize: document.getElementById('aFontSize').value,
                mixAnswers: document.getElementById('mixAnswers').checked,
                winText: document.getElementById('winText').value,
                loseText: document.getElementById('loseText').value,
                rounds: rounds
            };

            const jsonStr = JSON.stringify(projectData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (projectData.gameTitle.trim() || 'alice_game') + '_project.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function updateLangTexts() {
            const lang = document.getElementById('uiLang').value;
            document.getElementById('startBtnText').value = startDict[lang] || "START";
            document.getElementById('tryAgainText').value = tryDict[lang] || "Try Again";
            document.getElementById('playAgainText').value = winDict[lang] || "Play Again";
            debounceGenerate();
        }
        
        document.getElementById('qFontSize').addEventListener('input', (e) => { document.getElementById('qSizeLbl').innerText = e.target.value; });
        document.getElementById('aFontSize').addEventListener('input', (e) => { document.getElementById('aSizeLbl').innerText = e.target.value; });
        document.getElementById('aliceSize').addEventListener('input', (e) => { document.getElementById('aliceSizeLbl').innerText = e.target.value; });
        document.getElementById('artifactSize').addEventListener('input', (e) => { document.getElementById('artifactSizeLbl').innerText = e.target.value; });

        function addRound(name = null, qList = null, aList = null) {
            if (roundCount >= 5) { alert("Максимум 5 раундов!"); return; }
            roundCount++;
            const div = document.createElement('div');
            div.className = 'round-box';
